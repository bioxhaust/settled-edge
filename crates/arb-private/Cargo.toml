[package]
name = "arb-private"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
arb-num = { path = "../arb-num" }
arb-types = { path = "../arb-types" }
# arb-scan is intentionally NOT a dependency yet. Nothing in this crate imports
# it, and an unused path dependency means arb-private cannot build while
# arb-scan is mid-flight. Re-add it the day a private strategy actually reuses
# scan machinery. The arrow may only ever point this way
# (arb-private -> arb-scan), never the reverse: arb-scan ships.
